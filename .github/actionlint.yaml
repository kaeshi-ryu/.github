# actionlint configuration (format: docs/config.md of the actionlint v1.7.12 release).
paths:
  .github/workflows/release.yml:
    ignore:
      # False positive: actionlint v1.7.12 does not know the documented `concurrency.queue`
      # key (docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/
      # control-workflow-concurrency, "queueing multiple pending runs"), which release.yml
      # uses. Upstream: rhysd/actionlint#657. Remove this entry once a release accepts the key.
      - 'unexpected key "queue" for "concurrency" section'
